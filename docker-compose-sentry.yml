version: '3.8'
services:
  sentry-redis:
    image: redis:7-alpine
    volumes:
      - sentry-redis:/data

  sentry-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry-postgres:/var/lib/postgresql/data

  sentry-migrate:
    image: getsentry/sentry:latest
    depends_on:
      - sentry-redis
      - sentry-postgres
    command: |
      sh -c "
        sentry upgrade --noinput &&
        sentry createuser --email admin@example.com --password admin123 --superuser --no-input
      "
    environment:
      SENTRY_SECRET_KEY: "your-secret-key-32-chars-long!!"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
    volumes:
      - sentry-data:/var/lib/sentry/files

  sentry-web:
    image: getsentry/sentry:latest
    depends_on:
      - sentry-redis
      - sentry-postgres
      - sentry-migrate
    ports:
      - "9100:9000"
    environment:
      SENTRY_SECRET_KEY: "your-secret-key-32-chars-long!!"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
    volumes:
      - sentry-data:/var/lib/sentry/files

  sentry-worker:
    image: getsentry/sentry:latest
    depends_on:
      - sentry-redis
      - sentry-postgres
      - sentry-migrate
    command: run worker
    environment:
      SENTRY_SECRET_KEY: "your-secret-key-32-chars-long!!"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis

  sentry-cron:
    image: getsentry/sentry:latest
    depends_on:
      - sentry-redis
      - sentry-postgres
      - sentry-migrate
    command: run cron
    environment:
      SENTRY_SECRET_KEY: "your-secret-key-32-chars-long!!"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis

volumes:
  sentry-data:
  sentry-redis:
  sentry-postgres: