# Application Configuration
spring:
  application:
    name: ${APP_NAME:spaced-repetition}
  
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://aibles-java.fun:3309/spaced_repetition?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:admin_dev}
    password: ${DB_PASSWORD:mkUaSc1ZinlKnH4}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
        jdbc:
          time_zone: ${DB_TIMEZONE:UTC}
        validator:
          apply_to_ddl: false
  
  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          debug: ${MAIL_SMTP_DEBUG:false}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Security Configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:default-secret-key-change-in-production}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# Logging Configuration
logging:
  level:
    org.aibles.spaced_repetition: INFO
    org.elasticsearch.client: INFO
    com.internetitem.logback.elasticsearch: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Elasticsearch Configuration
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  cluster-name: ${ELASTICSEARCH_CLUSTER_NAME:spaced-repetition-cluster}
  index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:spaced_repetition_logs}

# File Upload Configuration
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    max-size: ${FILE_MAX_SIZE:10MB}
    allowed-types: ${FILE_ALLOWED_TYPES:jpg,jpeg,png,gif,pdf}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  use-management-port: false

# Sentry Configuration (Enabled - Cloud)
sentry:
  dsn: ${SENTRY_DSN:https://bfc7bbe5b5c0497b885f6b9be53d3b9e@o4507869043441664.ingest.de.sentry.io/4507869048422480}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  debug: ${SENTRY_DEBUG:true}
  attach-stacktrace: true
  send-default-pii: false

# API Configuration
api:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}
    burst-capacity: ${RATE_LIMIT_BURST:200}
  
  pagination:
    default-page-size: ${PAGINATION_DEFAULT_SIZE:20}
    max-page-size: ${PAGINATION_MAX_SIZE:100}